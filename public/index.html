<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Career Copilot</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="shell">
    <header class="shell-header">
      <h1>AI Career Copilot</h1>
      <p class="subtitle">Get a detailed, honest breakdown of your resume.</p>
    </header>

    <section class="card">
      <div class="tabs">
        <button class="tab-btn active" data-tab="upload-tab">Upload File</button>
        <button class="tab-btn" data-tab="paste-tab">Paste Text</button>
      </div>

      <div id="upload-tab" class="tab-panel active">
        <label for="file-input" class="dropzone" id="dropzone">
          <span class="dropzone-icon">⬆</span>
          <span id="dropzone-label">Drag &amp; drop your resume (PDF or DOCX)<br />or click to browse</span>
        </label>
        <input type="file" id="file-input" accept=".pdf,.docx" hidden />
      </div>

      <div id="paste-tab" class="tab-panel">
        <textarea id="paste-textarea" placeholder="Paste your resume text here..." rows="10"></textarea>
      </div>

      <div id="extract-status" class="status-line" hidden></div>

      <div class="field-group">
        <label for="jd-textarea">Optional: paste a job description for a targeted match</label>
        <textarea id="jd-textarea" placeholder="Paste the job description here (optional)..." rows="6"></textarea>
      </div>

      <button id="extract-btn">Extract Resume Text</button>

      <div id="result-box" class="result-box" hidden></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
